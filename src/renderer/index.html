<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self'">
  <title>MegaShelf</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="vignette"></div>

  <nav id="rail" aria-label="Systems"></nav>

  <header id="status" hidden></header>

  <section id="info">
    <div id="info-system"></div>
    <h1 id="info-title"></h1>
    <div id="info-meta"></div>
  </section>

  <aside id="details" hidden aria-label="Game details"></aside>
  <div id="letter" hidden aria-hidden="true"></div>

  <footer id="hints"></footer>

  <div id="empty" hidden>
    <h2 class="when-empty">Your shelf is empty</h2>
    <p class="when-empty">Add a ROM folder for a system, or install a game through Steam, Epic, GOG or another launcher.</p>
    <button class="when-empty" id="empty-open" type="button">Open settings</button>
    <h2 class="when-filtered">No games match your filters</h2>
    <p class="when-filtered">Your library has games, but the current view options hide all of them.</p>
    <button class="when-filtered" id="empty-reset" type="button">Reset filters</button>
  </div>

  <aside id="settings" hidden aria-label="Settings"></aside>
  <div id="menu" hidden role="dialog" aria-label="Menu"></div>
  <div id="entry" hidden role="dialog" aria-label="Text entry"></div>

  <div id="toasts" aria-live="polite"></div>
  <div id="fade"><div id="fade-label"></div></div>

  <script type="module" src="app.js"></script>
</body>
</html>
